server {
    listen 80;
    server_name app.YOUR_DOMAIN_HERE www.YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.YOUR_DOMAIN_HERE;

    ssl_certificate /etc/letsencrypt/live/app.YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.YOUR_DOMAIN_HERE/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
    }

    location /static/ {
        alias /opt/easya-frontend/build/;
    }
}
