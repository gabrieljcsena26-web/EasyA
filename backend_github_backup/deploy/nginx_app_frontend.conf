# Nginx template for the frontend app domain (HTTPS + SPA)
# Assumes you deploy the built frontend to /opt/easya-frontend/dist

server {
    listen 80;
    server_name app.YOUR_DOMAIN_HERE;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name app.YOUR_DOMAIN_HERE;

    ssl_certificate /etc/letsencrypt/live/app.YOUR_DOMAIN_HERE/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.YOUR_DOMAIN_HERE/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /opt/easya-frontend/dist;
    index index.html;

    # Static assets cache
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
